<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPA Keyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--ink:#161513;--muted:#7a746a;--line:#d8d1c3;--accent:#2f6b3a;--card:#fbf8f2}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:56px 24px}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:clamp(2.2rem,6vw,3.8rem);letter-spacing:-.02em}
h1 em{color:var(--accent)}
.sub{color:var(--muted);margin:10px 0 36px}
.out{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
textarea{width:100%;min-height:96px;border:0;background:transparent;resize:vertical;outline:none;font:400 1.7rem 'Noto Sans',sans-serif;color:var(--ink)}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:600 .8rem 'Noto Sans',sans-serif;cursor:pointer}
.act{background:var(--ink);color:var(--bg);border:0;padding:9px 16px;border-radius:4px;letter-spacing:.04em;text-transform:uppercase}
.act.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.act:hover{background:var(--accent);color:#fff}
.conv{margin-bottom:22px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:400 1.1rem 'Noto Sans',sans-serif;color:var(--ink);outline:none}
.row input:focus{border-color:var(--accent)}
.note{min-height:1.2em;margin-top:8px;font-size:.8rem;color:var(--muted)}
.credits{margin-top:40px;font-size:.75rem;color:var(--muted);line-height:1.5}
.credits a{color:inherit}
section{margin-top:34px}
h2{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.key{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 6px 9px;text-align:center;transition:.15s;color:var(--ink)}
.key:hover{border-color:var(--accent);transform:translateY(-2px)}
.key:active{background:var(--accent);color:#fff}
.key b{display:block;font:400 1.7rem 'Noto Sans',sans-serif;font-weight:400}
.key small{display:block;font-size:.72rem;color:var(--muted);margin-top:3px;font-weight:400}
.key:active small{color:#dfe}
footer{background:#000;border-top:1px solid rgba(255,255,255,.1);color:#fff;padding:22px 32px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.m-logo{display:flex;align-items:center;gap:10px;font-size:1.1rem;color:#fff;text-decoration:none}
.m-logo b{font-weight:700}
.m-logo .acc{color:#4ADE80}
.led{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 6px #4ADE80,0 0 12px #4ADE80;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.m-tag,.m-rights{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.m-rights{text-align:right}
@media(max-width:700px){footer{grid-template-columns:1fr;justify-items:center;text-align:center}footer>span{display:none}.m-rights{text-align:center}}
</style>
</head>
<body>
<main>
  <h1>IPA <em>Keyboard</em></h1>
  <p class="sub">Type English text to convert it to IPA, or click the symbols below to write phonetics by hand. Copy when you're done.</p>

  <div class="conv">
    <h2>Text to IPA</h2>
    <div class="row">
      <input id="src" type="text" placeholder="Type English: hi" autocomplete="off" spellcheck="false">
      <button class="act" id="go">Convert</button>
    </div>
    <p class="note" id="note"></p>
  </div>

  <div class="out">
    <textarea id="out" placeholder="/haɪ/" spellcheck="false"></textarea>
    <div class="bar">
      <button class="act" id="copy">Copy</button>
      <button class="act ghost" id="slash">Wrap in / /</button>
      <button class="act ghost" id="back">⌫</button>
      <button class="act ghost" id="clear">Clear</button>
    </div>
  </div>

  <div id="keys"></div>

  <p class="credits">Pronunciations from the CMU Pronouncing Dictionary, &copy; Carnegie Mellon University, used under a BSD-style license (<a href="LICENSE-cmudict.txt" target="_blank">license</a>).</p>
</main>
<footer>
  <span></span>
  <div class="m-logo"><span class="led"></span><span>Developed by</span> <b>m<span class="acc">2</span>aq</b></div>
  <div class="m-rights">© <span id="yr"></span></div>
</footer>
<script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

<script>
const groups = {
  "Vowels": [["iː","sheep"],["ɪ","ship"],["ɛ","bed"],["æ","cat"],["ɑː","father"],["ɒ","hot"],["ɔː","door"],["ʊ","foot"],["uː","blue"],["ʌ","cup"],["ɜː","bird"],["ə","about"]],
  "Diphthongs": [["eɪ","day"],["aɪ","my"],["ɔɪ","boy"],["aʊ","now"],["əʊ","go (UK)"],["oʊ","go (US)"],["ɪə","here"],["eə","hair"],["ʊə","tour"]],
  "Consonants": [["p","pen"],["b","bad"],["t","tea"],["d","dog"],["k","cat"],["ɡ","go"],["f","fan"],["v","van"],["θ","think"],["ð","this"],["s","sun"],["z","zoo"],["ʃ","she"],["ʒ","vision"],["h","hat"],["tʃ","chair"],["dʒ","jam"],["m","man"],["n","no"],["ŋ","sing"],["l","leg"],["r","red"],["j","yes"],["w","we"]],
  "Marks": [["ˈ","primary stress"],["ˌ","secondary"],["ː","long"],[".","syllable"],["/","slash"]]
};
const out = document.getElementById('out');
const box = document.getElementById('keys');
for (const [name, list] of Object.entries(groups)) {
  const s = document.createElement('section');
  s.innerHTML = `<h2>${name}</h2><div class="grid"></div>`;
  const g = s.querySelector('.grid');
  list.forEach(([sym, ex]) => {
    const b = document.createElement('button');
    b.className = 'key';
    b.innerHTML = `<b>${sym}</b><small>${ex}</small>`;
    b.onclick = () => insert(sym);
    g.appendChild(b);
  });
  box.appendChild(s);
}
function insert(t){
  const a = out.selectionStart, z = out.selectionEnd;
  out.setRangeText(t, a, z, 'end');
  out.focus();
}
/* ---------- Text -> IPA (CMU dict, American English) ---------- */
const ARPA = {AA:'ɑ',AE:'æ',AO:'ɔ',AW:'aʊ',AY:'aɪ',B:'b',CH:'tʃ',D:'d',DH:'ð',EH:'ɛ',EY:'eɪ',F:'f',G:'ɡ',HH:'h',IH:'ɪ',IY:'i',JH:'dʒ',K:'k',L:'l',M:'m',N:'n',NG:'ŋ',OW:'oʊ',OY:'ɔɪ',P:'p',R:'r',S:'s',SH:'ʃ',T:'t',TH:'θ',UH:'ʊ',UW:'u',V:'v',W:'w',Y:'j',Z:'z',ZH:'ʒ'};
const ONSETS = new Set(['pl','pr','bl','br','tr','dr','kl','kr','ɡl','ɡr','fl','fr','θr','ʃr','sp','st','sk','sm','sn','sl','sw','tw','kw','dw','ɡw','spl','spr','str','skr','skw','hj','mj','nj','pj','bj','tj','dj','kj','fj','vj','sj','zj','lj']);
let dict = null, dictLoading = null;
function loadDict() {
  if (dict) return Promise.resolve();
  if (dictLoading) return dictLoading;
  dictLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'cmudict.js';
    s.onload = () => {
      dict = new Map();
      for (const line of window.CMU_RAW.split('\n')) {
        const i = line.indexOf(' ');
        dict.set(line.slice(0, i), line.slice(i + 1));
      }
      window.CMU_RAW = null;
      res();
    };
    s.onerror = () => { dictLoading = null; rej(new Error('Could not load cmudict.js')); };
    document.head.appendChild(s);
  });
  return dictLoading;
}
function arpaToIpa(phones) {
  // build list of segments: {ipa, vowel, stress}
  const seg = phones.split(' ').map(p => {
    const m = p.match(/^([A-Z]+)([012])?$/);
    const base = m[1], st = m[2];
    const vowel = st !== undefined;
    let ipa = ARPA[base] || '';
    if (base === 'AH') ipa = st === '0' ? 'ə' : 'ʌ';
    if (base === 'ER') ipa = st === '0' ? 'ɚ' : 'ɝ';
    return { ipa, vowel, stress: st };
  });
  // insert stress marks at the start of the syllable onset (max onset)
  const marks = {};
  const multi = seg.filter(s => s.vowel).length > 1;
  seg.forEach((s, i) => {
    if (!multi || !s.vowel || (s.stress !== '1' && s.stress !== '2')) return;
    let j = i;
    while (j > 0 && !seg[j - 1].vowel) j--;
    let start = i;
    for (let k = j; k < i; k++) {
      const cluster = seg.slice(k, i).map(x => x.ipa).join('');
      if (i - k === 1 ? seg[k].ipa !== 'ŋ' : ONSETS.has(cluster)) { start = k; break; }
    }
    marks[start] = s.stress === '1' ? 'ˈ' : 'ˌ';
  });
  return seg.map((s, i) => (marks[i] || '') + s.ipa).join('');
}
function textToIpa(text) {
  const words = text.toLowerCase().match(/[a-z']+/g) || [];
  const missing = [];
  const out = words.map(w => {
    const p = dict.get(w) || dict.get(w.replace(/^'+|'+$/g, ''));
    if (!p) { missing.push(w); return w + '*'; }
    return arpaToIpa(p);
  });
  return { ipa: out.length ? '/' + out.join(' ') + '/' : '', missing };
}
async function convert() {
  const note = document.getElementById('note');
  const text = document.getElementById('src').value.trim();
  if (!text) return;
  note.textContent = 'Loading dictionary…';
  try { await loadDict(); } catch (e) { note.textContent = e.message; return; }
  const { ipa, missing } = textToIpa(text);
  if (!ipa) { note.textContent = 'Type some English words.'; return; }
  out.value = ipa;
  note.textContent = missing.length ? 'Not in dictionary (marked with *): ' + missing.join(', ') : '';
  out.focus();
}
document.getElementById('go').onclick = convert;
document.getElementById('src').addEventListener('keydown', e => { if (e.key === 'Enter') convert(); });

document.getElementById('copy').onclick = async e => {
  const btn = e.target;
  let ok = false;
  try { await navigator.clipboard.writeText(out.value); ok = true; } catch (_) {}
  if (!ok) {
    out.focus(); out.select();
    try { ok = document.execCommand('copy'); } catch (_) {}
    out.setSelectionRange(out.value.length, out.value.length);
  }
  btn.textContent = ok ? 'Copied ✓' : 'Press Ctrl+C';
  setTimeout(() => btn.textContent = 'Copy', 1400);
};
document.getElementById('slash').onclick = () => { out.value = '/' + out.value.replace(/^\/|\/$/g,'') + '/'; };
document.getElementById('back').onclick = () => { out.value = Array.from(out.value).slice(0,-1).join(''); out.focus(); };
document.getElementById('clear').onclick = () => { out.value = ''; out.focus(); };
</script>
</body>
</html>
